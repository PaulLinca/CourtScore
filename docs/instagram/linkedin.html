<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtScore – LinkedIn Feature Graphic</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: 'Inter', sans-serif;
    }

    /* ===== CARD ===== */
    .card {
      width: 1200px;
      height: 627px;
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
      display: flex;
      flex-direction: row;
    }

    /* ===== BACKGROUND ELEMENTS ===== */
    .court-lines {
      position: absolute;
      inset: 0;
      opacity: 0.05;
    }
    .court-lines svg { width: 100%; height: 100%; }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
    }
    .blob-1 {
      width: 520px; height: 520px;
      background: #29ABE2;
      top: -200px; left: -120px;
      opacity: 0.16;
    }
    .blob-2 {
      width: 380px; height: 380px;
      background: #FF6B35;
      bottom: -140px; right: 240px;
      opacity: 0.10;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: #29ABE2;
      bottom: -100px; right: -60px;
      opacity: 0.12;
    }

    /* ===== LEFT: TEXT CONTENT ===== */
    .left {
      flex: 1;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 56px 60px 72px;
      gap: 0;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 36px;
    }
    .mini-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(41,171,226,0.45);
    }
    .app-name {
      font-size: 30px;
      font-weight: 900;
      color: white;
      letter-spacing: -0.5px;
    }
    .app-name span { color: #29ABE2; }

    .eyebrow {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #29ABE2;
      margin-bottom: 20px;
    }

    .headline {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.0;
      color: #ffffff;
      margin-bottom: 28px;
      letter-spacing: -1.5px;
    }
    .headline em {
      font-style: normal;
      color: #29ABE2;
    }

    .sub {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255,255,255,0.50);
      line-height: 1.6;
      max-width: 420px;
      margin-bottom: 40px;
    }

    .pills {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 44px;
    }
    .pill {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.10);
      border-radius: 100px;
      padding: 9px 22px;
      font-size: 15px;
      font-weight: 700;
      color: rgba(255,255,255,0.50);
    }
    .pill.active {
      background: rgba(41,171,226,0.12);
      border-color: rgba(41,171,226,0.38);
      color: #29ABE2;
    }

    .cta {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .cta-badge {
      background: #29ABE2;
      color: #0a0a0a;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
      padding: 15px 40px;
      border-radius: 100px;
    }
    .cta-sub {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
    }

    /* ===== RIGHT: SCREENSHOTS ===== */
    .right {
      width: 620px;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screens-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 40px;
      padding: 24px;
    }

    .screen {
      border-radius: 24px;
      overflow: hidden;
      width: 160px;
      height: 200px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 0 1.5px rgba(255,255,255,0.08);
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Divider line */
    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.07) 30%, rgba(255,255,255,0.07) 70%, transparent);
    }

    /* Bottom watermark */
    .watermark {
      position: absolute;
      bottom: 24px;
      left: 72px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.12);
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 3;
    }
  </style>
</head>
<body>
