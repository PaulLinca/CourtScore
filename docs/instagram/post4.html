<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtScore – Post 4 (Android Launch)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
      font-family: 'Inter', sans-serif;
    }

    .slides-row {
      display: flex;
      gap: 24px;
    }

    /* ====== SINGLE SLIDE ====== */
    .slide {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* =====================================================
       SLIDE A – Android launch hero
       Distinguishable from post2: green accent, single
       centred screenshot trio with tilt, darker gradient.
    ===================================================== */
    .slide-a {
      background: #080808;
      justify-content: flex-end;
      padding-bottom: 88px;
    }

    /* Layered background glows – green tones instead of blue/orange */
    .slide-a .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(61,220,132,0.11) 0%, transparent 60%),
        radial-gradient(ellipse at 15% 80%, rgba(61,220,132,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 75%, rgba(41,171,226,0.07) 0%, transparent 45%);
    }

    /* Subtle grid / texture */
    .slide-a .grid-lines {
      position: absolute;
      inset: 0;
      opacity: 0.025;
      background-image:
        linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
      background-size: 72px 72px;
    }

    /* Three watches in a staggered row */
    .watch-trio {
      position: absolute;
      top: 128px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .watch-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .watch-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 18px;
    }

    /* Centre watch sits higher */
    .watch-center {
      margin-top: -28px;
    }

    .watch-img-main {
      width: 260px;
      filter:
        drop-shadow(0 0 30px rgba(61,220,132,0.35))
        drop-shadow(0 24px 50px rgba(0,0,0,0.85));
    }

    .watch-img-side {
      width: 240px;
      filter:
        drop-shadow(0 0 18px rgba(61,220,132,0.18))
        drop-shadow(0 18px 40px rgba(0,0,0,0.75));
    }

    /* Connecting glow line between watches */
<!--    .watch-trio::after {-->
<!--      content: '';-->
<!--      position: absolute;-->
<!--      bottom: -18px;-->
<!--      left: 10%;-->
<!--      width: 80%;-->
<!--      height: 1px;-->
<!--      background: linear-gradient(90deg, transparent, rgba(61,220,132,0.25), transparent);-->
<!--    }-->

    /* Bottom text */
    .bottom-content {
      position: relative;
      z-index: 2;
      padding: 0 88px;
      text-align: center;
    }

    .tag {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #3DDC84;
      margin-bottom: 22px;
    }

    .headline {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.04;
      color: #ffffff;
      margin-bottom: 26px;
    }

    .headline em {
      font-style: normal;
      color: #3DDC84;
    }

    .sub {
      font-size: 28px;
      color: rgba(255,255,255,0.45);
      line-height: 1.55;
    }

    /* Platform badge row */
    .platform-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 30px;
    }

    .platform-badge {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 28px;
      border-radius: 100px;
      border: 1.5px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.4);
    }

    .platform-badge.active {
      border-color: #3DDC84;
      color: #3DDC84;
      background: rgba(61,220,132,0.07);
    }

    .platform-badge.apple {
      background: rgba(41,171,226,0.15);
      border-color: rgba(41,171,226,0.4);
      color: #29ABE2;
    }

    .platform-divider {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    /* =====================================================
       SLIDE B – Set celebration / feature moment
       Distinguishable: green glow rings, left-aligned text
       layout vs post2's centred composition.
    ===================================================== */
    .slide-b {
      background: #080808;
    }

    /* Asymmetric glow blob – top-left origin */
    .slide-b .bg-blob {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(61,220,132,0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 70%, rgba(41,171,226,0.08) 0%, transparent 45%);
    }

    /* Large decorative ring – green, offset to the right */
    .slide-b .glow-ring {
      position: absolute;
      width: 780px;
      height: 780px;
      border-radius: 50%;
      border: 1.5px solid rgba(61,220,132,0.12);
      top: 50%;
      left: 65%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 0 140px rgba(61,220,132,0.06);
    }

    .slide-b .glow-ring-2 {
      position: absolute;
      width: 960px;
      height: 960px;
      border-radius: 50%;
      border: 1px solid rgba(61,220,132,0.05);
      top: 50%;
      left: 65%;
      transform: translate(-50%, -50%);
    }

    /* Two-column layout: text left, watch right */
    .slide-b .inner {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 100px 80px;
      gap: 60px;
    }

    .slide-b .text-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-b .top-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-bottom: 36px;
    }

    .slide-b .headline {
      font-size: 78px;
      font-weight: 900;
      line-height: 1.04;
      color: white;
      margin-bottom: 28px;
    }

    .slide-b .headline em {
      color: #3DDC84;
      font-style: normal;
    }

    .slide-b .sub {
      font-size: 28px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      margin-bottom: 52px;
    }

    .slide-b .bottom-tag {
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.14);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .slide-b .watch-col {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .set-watch {
      width: 300px;
      filter:
        drop-shadow(0 0 40px rgba(61,220,132,0.38))
        drop-shadow(0 30px 60px rgba(0,0,0,0.8));
    }

    .set-watch-2 {
      width: 260px;
      filter:
        drop-shadow(0 0 24px rgba(41,171,226,0.28))
        drop-shadow(0 20px 45px rgba(0,0,0,0.7));
    }
  </style>
</head>
<body>
  <div class="slides-row">

    <!-- SLIDE A: Android launch hero -->
    <div class="slide slide-a">
      <div class="bg-glow"></div>

      <div class="watch-trio">
        <div class="watch-frame">
          <div class="watch-label">New match</div>
          <img class="watch-img-side" src="../screenshots/ss_android_new.png" alt="New match">
        </div>
        <div class="watch-frame watch-center">
          <div class="watch-label">Live score</div>
          <img class="watch-img-main" src="../screenshots/ss_android_match.png" alt="Match screen">
        </div>
        <div class="watch-frame">
          <div class="watch-label">Set won!</div>
          <img class="watch-img-side" src="../screenshots/ss_android_set.png" alt="Set screen">
        </div>
      </div>

      <div class="bottom-content">
        <div class="tag">Wear OS · Now Available</div>
        <h1 class="headline">CourtScore<br>is <em>on Android.</em></h1>
        <p class="sub">Score your padel match from your wrist.<br>No phone. No distractions.</p>
        <div class="platform-row">
          <div class="platform-badge apple">Apple Watch</div>
          <div class="platform-divider"></div>
          <div class="platform-badge active">Wear OS</div>
        </div>
      </div>
    </div>


    <!-- SLIDE B: Set celebration / feature moment -->
    <div class="slide slide-b">
      <div class="inner">
        <div class="text-col">
          <div class="top-label">CourtScore</div>
          <h2 class="headline">Same app.<br><em>New wrist.</em></h2>
          <p class="sub">Every set, every point <br>tracked right on your<br>Android watch.</p>
          <div class="bottom-tag">Get it on the Play Store now!</div>
        </div>

        <div class="watch-col">
          <img class="set-watch" src="../screenshots/ss_android_set.png" alt="Set celebration">
          <img class="set-watch-2" src="../screenshots/ss_android_match.png" alt="Live score">
        </div>
      </div>
    </div>

  </div>
</body>
</html>
